<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ subject }}</title>
</head>
{# Email clients strip <style> blocks, so every rule here has to be inline. #}
<body style="margin:0;padding:0;background:#f4f6f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f6f5;padding:24px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:580px;background:#ffffff;border-radius:10px;overflow:hidden;border:1px solid #e3e8e6;">

          <tr>
            <td style="background:#0f6b5c;padding:22px 28px;">
              <div style="color:#ffffff;font-size:17px;font-weight:600;letter-spacing:.2px;">
                {{ site_name }}
              </div>
            </td>
          </tr>

          <tr>
            <td style="padding:30px 28px 10px;">
              <h1 style="margin:0 0 18px;font-size:21px;line-height:1.3;color:#14201d;font-weight:600;">
                {{ heading }}
              </h1>
              {% block content %}{% endblock %}
            </td>
          </tr>

          <tr>
            <td style="padding:14px 28px 30px;">
              <hr style="border:0;border-top:1px solid #eceeed;margin:0 0 16px;">
              <p style="margin:0;font-size:12px;line-height:1.6;color:#8b9793;">
                {{ site_name }}<br>
                This email was sent to {{ recipient }}.
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
